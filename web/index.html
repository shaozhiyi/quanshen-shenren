<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神人乱斗</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#e9edf7;--dim:#9aa6c2;--faint:#6d7a99}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#080b16;color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  #road{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(125% 90% at 50% 18%,rgba(8,11,22,0) 0%,rgba(8,11,22,.30) 52%,rgba(8,11,22,.78) 100%)}
  main{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:40px 22px}
  h1{margin:0;font-size:clamp(46px,11vw,104px);line-height:1.06;letter-spacing:.06em;font-weight:800;
    background:linear-gradient(180deg,#fff 18%,#c3d0f5 58%,#7c8dbd 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{display:inline-flex;align-items:center;gap:12px;margin-top:52px;text-decoration:none;
    color:#fff;font-weight:700;letter-spacing:.06em;font-size:clamp(17px,2.6vw,21px);
    padding:19px 44px;border-radius:13px;
    background:linear-gradient(180deg,#ef5a4f,#c22f28);
    box-shadow:0 14px 38px -12px rgba(226,72,63,.85),inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .16s ease,filter .16s ease}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .btn:active{transform:translateY(0)}
  .btn svg{width:20px;height:20px;flex:none}
  .size{margin:18px 0 0;color:var(--faint);font-size:13.5px;letter-spacing:.03em}
  .size span{color:var(--dim)}
  .doc{margin-top:30px;font-size:14px}
  .doc a{color:var(--dim);text-decoration:none;border-bottom:1px dashed #3b4a70;padding-bottom:2px}
  .doc a:hover{color:var(--ink);border-bottom-color:var(--dim)}
  footer{position:fixed;bottom:16px;left:0;right:0;z-index:2;text-align:center;
    color:#4c5876;font-size:12px;letter-spacing:.04em}
</style>
</head>
<body>
<canvas id="road" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<main>
  <h1>神人乱斗</h1>

  <a class="btn" href="files/game.exe" download="神人乱斗.exe">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v13"/><path d="M6 11l6 6 6-6"/><path d="M4 21h16"/>
    </svg>
    下载游戏本体
  </a>

  <p class="size"><span id="size">165.9&nbsp;MB</span> · 免安装单文件 · Windows 10/11 64 位</p>

  <p class="doc"><a href="files/readme.txt" download="说明.txt">说明.txt</a></p>
</main>

<footer>双击运行；Windows 若拦截，点「更多信息 → 仍要运行」</footer>

<script>
/* 黄昏国道背景：纯程序化 canvas，无图片、无外链 */
(function(){
  var cv=document.getElementById('road'); if(!cv) return;
  var g=cv.getContext('2d');
  var W=0,H=0,HZ=0,T=0,reduce=false;
  try{ reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,1.8);
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=Math.max(1,Math.floor(W*dpr)); cv.height=Math.max(1,Math.floor(H*dpr));
    g.setTransform(dpr,0,0,dpr,0,0);
    HZ=H*0.40;
    if(reduce) draw();
  }
  function pf(u){ return Math.pow(u,2.6); }            /* 0=消失点 1=画面底 */
  function yAt(u){ return HZ+(H-HZ)*pf(u); }
  function hw(u){ return W*0.155*pf(u); }
  function gap(){ return W*0.014; }

  function sky(){
    var s=g.createLinearGradient(0,0,0,HZ+2);
    s.addColorStop(0.00,'#0a0d1c'); s.addColorStop(0.52,'#18223c');
    s.addColorStop(0.82,'#3b3352'); s.addColorStop(1.00,'#7a4f4a');
    g.fillStyle=s; g.fillRect(0,0,W,HZ+2);
    g.fillStyle='#fff';
    for(var i=0;i<48;i++){
      var fx=((i*97.13)%1000)/1000, fy=((i*53.71)%1000)/1000;
      g.globalAlpha=0.10+0.34*Math.abs(Math.sin(i*1.7+T*0.0009));
      g.beginPath(); g.arc(fx*W,fy*HZ*0.66,(i%7===0)?1.5:0.9,0,6.2832); g.fill();
    }
    g.globalAlpha=1;
    var sun=g.createRadialGradient(W*0.5,HZ,0,W*0.5,HZ,Math.max(40,W*0.36));
    sun.addColorStop(0,'rgba(255,190,130,.32)'); sun.addColorStop(1,'rgba(255,190,130,0)');
    g.fillStyle=sun; g.fillRect(0,0,W,HZ+4);
  }
  function ground(){
    var s=g.createLinearGradient(0,HZ,0,H);
    s.addColorStop(0,'#4a4356'); s.addColorStop(0.30,'#241f2e'); s.addColorStop(1,'#0b0e18');
    g.fillStyle=s; g.fillRect(0,HZ,W,H-HZ+1);
  }
  function way(side){
    var cx=W*0.5, gp=gap();
    function inner(u){ return cx+side*(gp+hw(u)*0.05); }
    function outer(u){ return cx+side*(gp+hw(u)*2.05); }
    function mid(u){ return cx+side*(gp+hw(u)*1.05); }
    g.beginPath();
    g.moveTo(inner(0.012),yAt(0.012)); g.lineTo(inner(1),yAt(1));
    g.lineTo(outer(1),yAt(1)); g.lineTo(outer(0.012),yAt(0.012)); g.closePath();
    var asp=g.createLinearGradient(0,HZ,0,H);
    asp.addColorStop(0,'#4b5266'); asp.addColorStop(0.35,'#2b3143'); asp.addColorStop(1,'#191f2e');
    g.fillStyle=asp; g.fill();
    line(inner,'#e6c154'); line(outer,'#eef2ff');
    function line(fn,col){
      g.beginPath(); g.moveTo(fn(0.02),yAt(0.02)); g.lineTo(fn(1),yAt(1));
      g.strokeStyle=col; g.globalAlpha=0.72; g.lineWidth=1.2; g.stroke(); g.globalAlpha=1;
    }
    var n=14, phase=(T*0.00017)%1;
    for(var i=0;i<n;i++){
      var a=(i+phase)/n, b=a+0.55/n; if(b>1) continue;
      var u0=a*a, u1=b*b;
      g.beginPath(); g.moveTo(mid(u0),yAt(u0)); g.lineTo(mid(u1),yAt(u1));
      g.strokeStyle='#f6f9ff'; g.globalAlpha=0.34+0.62*pf(u0);
      g.lineWidth=Math.max(0.9,6.2*pf(u0)); g.stroke();
    }
    g.globalAlpha=1;
  }
  function poles(){
    var n=10, phase=(T*0.00017)%1;
    for(var s=-1;s<=1;s+=2){
      for(var i=0;i<n;i++){
        var u=(i+(s>0?phase:phase+0.5))/n; if(u>1) continue;
        u=u*u;
        var y=yAt(u), p=Math.max(pf(u),0.0001);
        var x=W*0.5+s*(gap()+hw(u)*2.42);
        var hgt=Math.max(3,104*p+2);
        g.strokeStyle='rgba(150,162,190,'+(0.10+0.42*p)+')';
        g.lineWidth=Math.max(0.6,2.1*p);
        g.beginPath(); g.moveTo(x,y); g.lineTo(x,y-hgt); g.stroke();
        var hx=x-s*Math.max(1,11*p);
        g.fillStyle='rgba(255,226,170,'+(0.14+0.66*p)+')';
        g.beginPath(); g.arc(hx,y-hgt,Math.max(0.8,3.2*p),0,6.2832); g.fill();
        var R=Math.max(9,62*p);
        var gl=g.createRadialGradient(hx,y-hgt,0,hx,y-hgt,R);
        gl.addColorStop(0,'rgba(255,212,150,'+(0.20+0.34*p)+')'); gl.addColorStop(1,'rgba(255,212,150,0)');
        g.fillStyle=gl; g.beginPath(); g.arc(hx,y-hgt,R,0,6.2832); g.fill();
        var sp=g.createRadialGradient(hx,y,0,hx,y,Math.max(6,40*p));
        sp.addColorStop(0,'rgba(255,206,150,'+(0.10+0.20*p)+')'); sp.addColorStop(1,'rgba(255,206,150,0)');
        g.fillStyle=sp; g.beginPath(); g.arc(hx,y,Math.max(6,40*p),0,6.2832); g.fill();
      }
    }
  }
  function haze(){
    var f=g.createLinearGradient(0,HZ-6,0,HZ+(H-HZ)*0.26);
    f.addColorStop(0,'rgba(126,110,124,0.92)'); f.addColorStop(1,'rgba(126,110,124,0)');
    g.fillStyle=f; g.fillRect(0,HZ-8,W,(H-HZ)*0.32);
    g.beginPath();
    g.moveTo(W*0.5,HZ); g.lineTo(W*0.5-W*0.021,H); g.lineTo(W*0.5+W*0.021,H); g.closePath();
    g.fillStyle='rgba(186,196,220,.46)'; g.fill();
  }
  function draw(){
    g.clearRect(0,0,W,H);
    sky(); ground(); way(-1); way(1); haze(); poles();
    var v=g.createLinearGradient(0,0,0,H);
    v.addColorStop(0,'rgba(8,11,22,.22)'); v.addColorStop(0.45,'rgba(8,11,22,0)');
    v.addColorStop(1,'rgba(8,11,22,.46)');
    g.fillStyle=v; g.fillRect(0,0,W,H);
  }
  function loop(){ T+=16; draw(); requestAnimationFrame(loop); }
  window.addEventListener('resize',resize);
  resize();
  if(!reduce) requestAnimationFrame(loop);

  /* 用真实体积覆盖写死的数字 */
  var el=document.getElementById('size');
  if(window.fetch&&el){
    fetch('files/game.exe',{method:'HEAD'}).then(function(r){
      var len=r.ok?r.headers.get('content-length'):null;
      if(len){ var n=parseInt(len,10); if(n>0) el.innerHTML=(n/1048576).toFixed(1)+'&nbsp;MB'; }
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
